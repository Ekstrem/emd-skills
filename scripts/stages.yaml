# Порядок склейки этапов в единый SKILL.md.
#
# common  — этапы, одинаковые для всех языков (склеиваются первыми, по порядку)
# <язык>  — ключ = имя каталога в languages/<язык>/
#
# Правило: каждый .md-файл из common/ и languages/<язык>/ должен быть здесь
# перечислен. Сборка падает, если файл не указан — иначе контент молча
# выпадал бы из артефакта.

common:
